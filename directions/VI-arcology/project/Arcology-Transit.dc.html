<!doctype html>

<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800;900&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EEF2;color:#1E2A38;font-family:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #F2C230;outline-offset:3px;border-radius:6px}
.ar-d{font-family:'Big Shoulders Display','Hanken Grotesk',sans-serif}
.ar-num{font-variant-numeric:lining-nums}
.ar-tnum{font-variant-numeric:tabular-nums lining-nums}
.ar-plate{background:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(30,42,56,.09),0 10px 22px -12px rgba(30,42,56,.38)}
.ar-plate-n{background:#1B2335;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(255,255,255,.06),0 10px 22px -12px rgba(0,0,0,.6)}
.ar-board{background:#141A26;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(0,0,0,.4),0 16px 30px -16px rgba(20,26,38,.7)}
.ar-flap{display:inline-block;position:relative;min-width:.62em;text-align:center;padding:0 .04em;border-radius:3px;background:linear-gradient(180deg,#232B3D 0 49%,#0E131E 49% 51%,#1C2334 51% 100%);color:#F2C230;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.ar-flip{animation:ar-flip .42s cubic-bezier(.3,.7,.3,1) both}
@keyframes ar-flip{0%{transform:perspective(160px) rotateX(-88deg);filter:brightness(.6)}100%{transform:perspective(160px) rotateX(0);filter:brightness(1)}}
.ar-tilt-t{-webkit-backdrop-filter:blur(2.6px);backdrop-filter:blur(2.6px);-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent);pointer-events:none}
.ar-tilt-b{-webkit-backdrop-filter:blur(2.6px);backdrop-filter:blur(2.6px);-webkit-mask-image:linear-gradient(0deg,#000,transparent);mask-image:linear-gradient(0deg,#000,transparent);pointer-events:none}
.ar-train{position:absolute;left:0;top:0;offset-rotate:auto;animation:ar-run 16s cubic-bezier(.45,.05,.55,.95) infinite alternate}
@keyframes ar-run{0%,8%{offset-distance:0%}92%,100%{offset-distance:100%}}
.ar-twinkle{animation:ar-tw 3.2s ease-in-out infinite alternate}
@keyframes ar-tw{from{opacity:.35}to{opacity:1}}
.ar-pulse{animation:ar-pulse 1.6s ease-in-out infinite}
@keyframes ar-pulse{50%{opacity:.35}}
.ar-stop{transition:transform .25s ease,background .25s ease}
.ar-stop:hover{transform:scale(1.12)}
@media (prefers-reduced-motion:reduce){.ar-train,.ar-twinkle,.ar-pulse,.ar-flip{animation:none!important}}
.at-flipA{animation:at-fa .46s cubic-bezier(.3,.7,.3,1) both}
.at-flipB{animation:at-fb .46s cubic-bezier(.3,.7,.3,1) both}
@keyframes at-fa{0%{transform:perspective(160px) rotateX(-88deg);filter:brightness(.55)}100%{transform:perspective(160px) rotateX(0);filter:brightness(1)}}
@keyframes at-fb{0%{transform:perspective(160px) rotateX(-88deg);filter:brightness(.55)}100%{transform:perspective(160px) rotateX(0);filter:brightness(1)}}
.at-amt{width:120px;height:44px;box-sizing:border-box;border:0;border-radius:12px;text-align:center;font-family:'Big Shoulders Display',sans-serif;font-size:24px;font-weight:800;color:#1E2A38;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px rgba(30,42,56,.14)}
.at-amt:focus{outline:none;box-shadow:inset 0 0 0 2px #F2C230,0 0 0 4px rgba(242,194,48,.25)}
.at-step{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.at-step:disabled{opacity:.35;cursor:not-allowed}
.at-sheet{animation:at-up .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes at-up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.at-payee{transition:background .2s ease}
.at-payee:hover{background:rgba(30,42,56,.05)}
@media (prefers-reduced-motion:reduce){.at-flipA,.at-flipB,.at-sheet{animation:none!important}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"amount":{"editor":"int","default":25000,"min":0,"max":118400,"section":"Transfer"},"$preview":{"width":402,"height":874}}'>
const BAL = 118400, LIMIT = 50000, CAR = 5000, HOLD = 1400;
const PAYEES = [
  { name: 'Pioneer Fund', flap: 'PIONEER FUND', sub: 'AI Pioneer Program, verified', verified: true, bg: '#1E2A38' },
  { name: 'Qubit Agents', flap: 'QUBIT AGENTS', sub: 'Vendor, verified', verified: true, bg: '#3D8BFF' },
  { name: 'Northline Labs', flap: 'NORTHLINE', sub: 'New payee, verification pending', verified: false, bg: '#8C6CF2' }
];
function fmt(v) { return '$' + Math.round(v).toLocaleString('en-US'); }
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    if (!this._h) {
      this._pick = PAYEES.map((p, i) => () => this.setState({ payee: i, sheet: false, flipD: ((this.state || {}).flipD || 0) + 1 }));
      const setAmt = (v) => { v = Math.max(0, Math.min(BAL, Math.round(v))); this.setState({ amount: v, amountText: null, flipA: ((this.state || {}).flipA || 0) + 1 }); };
      this._setAmt = setAmt;
      this._h = {
        openPayees: () => { if (this._phase() === 'ready') this.setState({ sheet: true }); },
        closePayees: () => this.setState({ sheet: false }),
        minus: () => { const a = this._amt(); setAmt(a % CAR ? Math.floor(a / CAR) * CAR : a - CAR); },
        plus: () => { const a = this._amt(); setAmt(a % CAR ? Math.ceil(a / CAR) * CAR : a + CAR); },
        onAmount: (e) => {
          const raw = e.target.value.replace(/[^0-9.]/g, '');
          const v = raw === '' ? 0 : Math.min(BAL, Math.floor(parseFloat(raw) || 0));
          this.setState({ amountText: e.target.value, amount: v });
        },
        normalize: () => { const a = this._amt(); this.setState({ amountText: null, flipA: ((this.state || {}).flipA || 0) + 1, amount: a }); },
        down: (e) => { if (e && e.button != null && e.button !== 0) return; this._start(); },
        up: () => this._cancel(),
        keyDown: (e) => { if ((e.key === ' ' || e.key === 'Enter') && !this._kh) { e.preventDefault(); this._kh = true; this._start(); } },
        keyUp: (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this._kh = false; this._cancel(); } },
        noMenu: (e) => e.preventDefault(),
        reset: () => { this._clear(); this.setState({ phase: 'ready', run: 0, hold: 0 }); }
      };
      this._amt = () => { const s = this.state || {}; return s.amount != null ? s.amount : (this.props.amount != null ? this.props.amount : 25000); };
      this._phase = () => (this.state || {}).phase || 'ready';
      this._start = () => {
        if (this._phase() !== 'ready' || !this._ok) return;
        const t0 = performance.now();
        const tick = (now) => {
          const p = Math.min(1, (now - t0) / HOLD);
          this.setState({ hold: p, phase: 'ready' });
          if (p >= 1) { this._raf = null; this._dispatch(); return; }
          this._raf = requestAnimationFrame(tick);
        };
        this._raf = requestAnimationFrame(tick);
      };
      this._cancel = () => { if (this._raf) { cancelAnimationFrame(this._raf); this._raf = null; if (this._phase() === 'ready') this.setState({ hold: 0 }); } };
      this._dispatch = () => {
        this.setState({ phase: 'running', run: 0, hold: 1 });
        let k = 0;
        const step = () => { k++; this.setState({ run: k }); if (k < 5) this._to = setTimeout(step, 520); else this._to = setTimeout(() => this.setState({ phase: 'arrived' }), 420); };
        this._to = setTimeout(step, 360);
      };
      this._clear = () => { if (this._raf) cancelAnimationFrame(this._raf); if (this._to) clearTimeout(this._to); this._raf = null; this._to = null; };
    }
    const amount = this._amt();
    const pi = st.payee || 0, P = PAYEES[pi];
    const phase = this._phase();
    const run = st.run || 0, hold = st.hold || 0;
    let block = '';
    if (amount <= 0) block = 'Enter an amount to load';
    else if (amount > LIMIT) block = 'Over the $50,000 daily limit. Needs a co-signer';
    else if (!P.verified) block = P.name + ' is not verified yet';
    this._ok = !block;
    // stations: origin, 4 checks, terminal
    const checks = [
      { name: 'Intent parsed', ok: true, sub: 'Send ' + fmt(amount) + ' to ' + P.name },
      { name: 'Payee verified', ok: P.verified, sub: P.verified ? 'Identity and account confirmed' : 'Verification pending' },
      { name: 'Balance covered', ok: amount > 0 && amount <= BAL, sub: amount <= BAL ? fmt(BAL - amount) + ' stays in Operating' : 'More than Operating holds' },
      { name: 'Within limits', ok: amount > 0 && amount <= LIMIT, sub: amount <= LIMIT ? 'Daily limit $50,000' : 'Over the daily limit' }
    ];
    const rows = [{ name: 'Operating Plaza', sub: phase === 'arrived' ? 'Operating ··4417, now ' + fmt(BAL - amount) : 'Operating ··4417, ' + fmt(BAL), kind: 'origin' }]
      .concat(checks.map((c) => Object.assign({ kind: 'check' }, c)))
      .concat([{ name: P.name, sub: phase === 'arrived' ? 'Arrived and settled instantly' : 'Arrives instantly on the ZEN line', kind: 'terminal' }]);
    const SP = 51;
    const stations = rows.map((r, i) => {
      const passed = phase !== 'ready' && i <= run;
      const big = r.kind !== 'check';
      let tag = '', tagInk = '#5B6B80';
      if (r.kind === 'check') { if (passed) { tag = 'Cleared'; tagInk = '#1F8A5B'; } else if (!r.ok) { tag = 'Blocked'; tagInk = '#C2412D'; } else { tag = 'Ready'; tagInk = '#5B6B80'; } }
      if (r.kind === 'terminal' && phase === 'arrived') { tag = 'Arrived'; tagInk = '#1F8A5B'; }
      return {
        y: i * SP, name: r.name, sub: r.sub, size: big ? 32 : 22, ml: big ? 0 : 5, fs: big ? 15 : 13.5,
        fill: passed ? '#F2C230' : '#FFFFFF', ring: passed ? '#1E2A38' : (r.kind === 'check' && !r.ok ? '#C2412D' : '#1E2A38'),
        ink: '#1E2A38', subInk: r.kind === 'check' && !r.ok ? '#C2412D' : '#5B6B80', tag: tag, tagInk: tagInk
      };
    });
    const runIdx = phase === 'ready' ? 0 : (phase === 'arrived' ? 5 : run);
    // departure board flaps
    const flipA = st.flipA || 0, flipD = st.flipD || 0;
    const pad = (s, n) => (s + ' '.repeat(n)).slice(0, n);
    const flap = (s, par) => s.split('').map((ch) => ({ ch: ch === ' ' ? ' ' : ch, cls: par ? (par % 2 ? 'at-flipA' : 'at-flipB') : '' }));
    // cars
    const full = Math.floor(amount / CAR), part = (amount % CAR) / CAR;
    const nShow = Math.min(9, full + (part > 0 ? 1 : 0));
    const cars = [], wheels = [];
    for (let i = 0; i < nShow; i++) {
      const x = 38 + i * 32, fill = i < full ? 1 : part;
      cars.push({ x: x, fy: (28 - 18 * fill).toFixed(1), fh: (18 * fill).toFixed(1) });
      wheels.push({ x: x + 7 }, { x: x + 21 });
    }
    wheels.push({ x: 9 }, { x: 25 });
    const statusText = phase === 'arrived' ? 'Arrived' : phase === 'running' ? 'Departing' : block ? 'Held at platform' : 'Ready to dispatch';
    return Object.assign({}, this._h, {
      flapDest: flap(pad(P.flap, 12), flipD), flapAmt: flap(pad(fmt(amount), 8), flipA),
      destAria: 'Destination: ' + P.name + '. Change destination',
      statusText: statusText, statusInk: phase === 'arrived' ? '#8FE9A6' : block ? '#FF9A8A' : '#F2C230',
      amountText: st.amountText != null ? st.amountText : amount.toLocaleString('en-US'),
      minusOff: phase !== 'ready' || amount <= 0, plusOff: phase !== 'ready' || amount >= BAL,
      afterText: fmt(BAL - Math.min(amount, BAL)) + (phase === 'arrived' ? ' now' : ' after'),
      cars: cars, wheels: wheels, moreOp: full + (part > 0 ? 1 : 0) > 9 ? 1 : 0,
      carsAria: 'Train with ' + full + ' full car' + (full === 1 ? '' : 's') + (part > 0 ? ' and one part-loaded car' : '') + ', carrying ' + fmt(amount),
      stations: stations, lineDone: (12 + runIdx * SP).toFixed(0), trainY: (runIdx * SP + 14).toFixed(0), trainOp: phase === 'ready' ? 0 : 1,
      showLever: phase !== 'arrived', showDone: phase === 'arrived',
      leverOff: phase !== 'ready' || !!block, leverOp: block ? 0.55 : 1,
      holdPct: (hold * 100).toFixed(1), leverRot: (-hold * 40).toFixed(1),
      leverTitle: phase === 'running' ? 'Departing…' : 'Hold to dispatch',
      leverSub: block || ('Sends ' + fmt(amount) + ' to ' + P.name),
      leverAria: block ? 'Dispatch unavailable: ' + block : 'Hold to dispatch ' + fmt(amount) + ' to ' + P.name + '. Press and hold, or hold Space',
      sheetOpen: !!st.sheet,
      payees: PAYEES.map((p, i) => ({ name: p.name, sub: p.sub, initial: p.name[0], bg: p.bg, on: i === pi, pick: this._pick[i], subInk: p.verified ? '#5B6B80' : '#C2412D' }))
    });
  }
  componentWillUnmount() { if (this._clear) this._clear(); }
}
</script>
