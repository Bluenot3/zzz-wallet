<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZEN Arcology — City</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800;900&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EEF2;color:#1E2A38;font-family:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #F2C230;outline-offset:3px;border-radius:6px}
.ar-d{font-family:'Big Shoulders Display','Hanken Grotesk',sans-serif}
.ar-num{font-variant-numeric:lining-nums}
.ar-tnum{font-variant-numeric:tabular-nums lining-nums}
.ar-plate{background:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(30,42,56,.09),0 10px 22px -12px rgba(30,42,56,.38)}
.ar-plate-n{background:#1B2335;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(255,255,255,.06),0 10px 22px -12px rgba(0,0,0,.6)}
.ar-board{background:#141A26;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(0,0,0,.4),0 16px 30px -16px rgba(20,26,38,.7)}
.ar-flap{display:inline-block;position:relative;min-width:.62em;text-align:center;padding:0 .04em;border-radius:3px;background:linear-gradient(180deg,#232B3D 0 49%,#0E131E 49% 51%,#1C2334 51% 100%);color:#F2C230;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.ar-flip{animation:ar-flip .42s cubic-bezier(.3,.7,.3,1) both}
@keyframes ar-flip{0%{transform:perspective(160px) rotateX(-88deg);filter:brightness(.6)}100%{transform:perspective(160px) rotateX(0);filter:brightness(1)}}
.ar-tilt-t{-webkit-backdrop-filter:blur(2.6px);backdrop-filter:blur(2.6px);-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent);pointer-events:none}
.ar-tilt-b{-webkit-backdrop-filter:blur(2.6px);backdrop-filter:blur(2.6px);-webkit-mask-image:linear-gradient(0deg,#000,transparent);mask-image:linear-gradient(0deg,#000,transparent);pointer-events:none}
.ar-train{position:absolute;left:0;top:0;offset-rotate:auto;animation:ar-run 16s cubic-bezier(.45,.05,.55,.95) infinite alternate}
@keyframes ar-run{0%,8%{offset-distance:0%}92%,100%{offset-distance:100%}}
.ar-twinkle{animation:ar-tw 3.2s ease-in-out infinite alternate}
@keyframes ar-tw{from{opacity:.35}to{opacity:1}}
.ar-pulse{animation:ar-pulse 1.6s ease-in-out infinite}
@keyframes ar-pulse{50%{opacity:.35}}
.ar-stop{transition:transform .25s ease,background .25s ease}
.ar-stop:hover{transform:scale(1.12)}
@media (prefers-reduced-motion:reduce){.ar-train,.ar-twinkle,.ar-pulse,.ar-flip{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 402px; height: 874px; overflow: hidden; background: {{sky}}; color: {{ink}}">

<svg width="402" height="874" viewBox="0 0 402 874" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<defs><clipPath id="ar-clip"><path d="{{city.clip}}"></path></clipPath></defs>
<g opacity="{{starOp}}">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="20">
<circle class="ar-twinkle" cx="{{s.x}}" cy="{{s.y}}" r="{{s.r}}" fill="#FFFFFF" opacity="{{s.op}}" style="animation-delay: {{s.dl}}"></circle>
</sc-for>
</g>
<sc-for list="{{city.ground}}" as="g" hint-placeholder-count="8">
<path d="{{g.d}}" fill="{{g.fill}}"></path>
</sc-for>
<g clip-path="url(#ar-clip)">
<sc-for list="{{shadows}}" as="s" hint-placeholder-count="20">
<path d="{{s.d}}" fill="{{s.fill}}"></path>
</sc-for>
</g>
<sc-for list="{{lights}}" as="l" hint-placeholder-count="20">
<circle cx="{{l.x}}" cy="{{l.y}}" r="1.7" fill="{{l.fill}}" style="filter: {{l.fx}}"></circle>
</sc-for>
<sc-for list="{{items}}" as="it" hint-placeholder-count="60">
<path d="{{it.d}}" fill="{{it.fill}}" opacity="{{it.op}}" style="filter: {{it.fx}}; transition: opacity .35s ease"></path>
</sc-for>
<sc-for list="{{city.front}}" as="fr" hint-placeholder-count="12">
<path d="{{fr.d}}" fill="none" stroke="{{fr.stroke}}" stroke-width="{{fr.w}}" stroke-linecap="round" stroke-linejoin="round"></path>
</sc-for>
<sc-for list="{{stations}}" as="st" hint-placeholder-count="2">
<rect x="{{st.x0}}" y="{{st.y0}}" width="16" height="5" rx="2.5" fill="{{st.fill}}" stroke="#F2C230" stroke-width="1.2"></rect>
</sc-for>
</svg>

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 402px; height: 874px; pointer-events: none">
<div class="ar-train" style="offset-path: path('{{city.beam}}')">
<svg width="30" height="9" viewBox="0 0 30 9" style="display: block; transform: translate(-15px, -7px)"><rect x=".5" y=".5" width="29" height="8" rx="4" fill="{{trainBody}}" stroke="#1E2A38" stroke-opacity=".35"></rect><rect x="3" y="2.4" width="20" height="2.2" rx="1.1" fill="{{trainWin}}"></rect><rect x="3" y="6" width="24" height="1.1" fill="#F2C230"></rect><circle cx="27" cy="3.6" r="1.3" fill="{{trainLamp}}"></circle></svg>
</div>
</div>

<div class="ar-tilt-t" style="position: absolute; left: 0; right: 0; top: 224px; height: 56px"></div>
<div class="ar-tilt-b" style="position: absolute; left: 0; right: 0; top: 500px; height: 52px"></div>

<header style="position: absolute; left: 20px; right: 20px; top: 50px; height: 44px; display: flex; align-items: center; gap: 10px">
<a href="Arcology-Vault.dc.html" aria-label="ZEN Arcology, treasury city" style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="22" viewBox="0 0 100 86" aria-hidden="true"><path fill="{{ink}}" fill-rule="evenodd" d="M0 31L12 31L22 21L10 21L10 9L44 9L0 53L0 75L5 75L10 70L10 57L58 9L77 9L0 86L100 86L100 55L88 55L78 65L90 65L90 77L56 77L100 33L100 11L95 11L90 16L90 29L42 77L23 77L100 0L0 0Z"></path></svg>
<span style="display: flex; flex-direction: column; gap: 1px">
<span class="ar-d" style="font-size: 23px; font-weight: 800; letter-spacing: .02em; line-height: 1">Arcology</span>
<span style="font-size: 11.5px; font-weight: 500; color: {{muted}}; line-height: 1.1">Your treasury, built to scale</span>
</span>
</a>
<button type="button" onClick="{{toggleNight}}" aria-pressed="{{nightOn}}" aria-label="{{nightLabel}}" class="{{plateCls}}" style="margin-left: auto; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isDay}}" hint-placeholder-val="{{true}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2A38" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
</sc-if>
<sc-if value="{{isNight}}" hint-placeholder-val="{{false}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2C230" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"></path></svg>
</sc-if>
</button>
</header>

<section aria-label="Total reserve" style="position: absolute; left: 20px; top: 106px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; color: {{muted}}">{{heroLabel}}</span>
<span class="ar-d ar-num" aria-live="polite" style="display: flex; align-items: flex-start; font-size: 76px; font-weight: 800; letter-spacing: -.01em; line-height: .92">{{heroWhole}}<span style="font-size: 30px; font-weight: 700; margin-top: 6px; margin-left: 2px; color: {{muted}}">{{heroCents}}</span></span>
<span style="margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: {{deltaInk}}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="transform: rotate({{deltaRot}}deg)"><path d="M5 1.2 9 8.4H1z" fill="{{deltaInk}}"></path></svg>{{deltaText}}</span>
</section>

<sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" class="{{p.cls}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; transform: {{p.tf}}; padding: 6px 9px 6px 6px; border-radius: 10px; display: flex; align-items: center; gap: 7px; text-align: left; white-space: nowrap; opacity: {{p.op}}; transition: opacity .35s ease">
<span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{p.line}}; color: #FFFFFF; font-size: 11px; font-weight: 800" class="ar-d">{{p.glyph}}</span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 12px; font-weight: 700; line-height: 1.1">{{p.name}}</span>
<span class="ar-tnum" style="font-size: 11px; font-weight: 500; color: {{p.sub}}; line-height: 1.1"><b style="font-weight: 700">{{p.value}}</b> {{p.share}}</span>
</span>
</button>
</sc-for>
<sc-for list="{{stems}}" as="s" hint-placeholder-count="4">
<span aria-hidden="true" style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: 1px; height: 12px; background: {{s.c}}; opacity: {{s.op}}"></span>
</sc-for>

<section aria-label="Skyline over time" style="position: absolute; left: 20px; right: 20px; top: 566px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span class="ar-d" style="font-size: 19px; font-weight: 700; letter-spacing: .01em">Skyline</span>
<span style="font-size: 12px; font-weight: 600; color: {{muted}}">{{scrubNote}}</span>
</div>
<div role="group" aria-label="Choose a month to rebuild the skyline" style="position: relative; margin-top: 12px; height: 48px">
<span aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 14px; height: 6px; border-radius: 3px; background: {{lineBg}}"></span>
<span aria-hidden="true" style="position: absolute; left: 14px; top: 14px; height: 6px; border-radius: 3px; width: {{lineFill}}px; background: #F2C230; transition: width .5s cubic-bezier(.3,.7,.3,1)"></span>
<sc-for list="{{stops}}" as="m" hint-placeholder-count="7">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" aria-label="{{m.aria}}" style="position: absolute; left: {{m.x}}px; top: 0; width: 34px; height: 46px; margin-left: -17px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span class="ar-stop" aria-hidden="true" style="width: {{m.size}}px; height: {{m.size}}px; margin-top: {{m.mt}}px; border-radius: 50%; box-sizing: border-box; background: {{m.fill}}; border: 2.5px solid {{m.ring}}"></span>
<span style="font-size: 11px; font-weight: {{m.weight}}; color: {{m.ink}}">{{m.label}}</span>
</button>
</sc-for>
</div>
</section>

<a href="Arcology-Transit.dc.html" class="ar-board" aria-label="Next departure: $25,000 to Pioneer Fund, ready to dispatch. Open Transit" style="position: absolute; left: 20px; right: 20px; top: 668px; height: 92px; border-radius: 16px; box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; color: #E8EDF3">
<span style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: #9AA6B8">Next departure<span style="display: flex; align-items: center; gap: 6px; color: #F2C230"><span class="ar-pulse" aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #F2C230"></span>Ready to dispatch</span></span>
<span style="display: flex; align-items: center; justify-content: space-between">
<span class="ar-d" aria-hidden="true" style="display: flex; gap: 2px; font-size: 22px; font-weight: 700; letter-spacing: .04em">
<sc-for list="{{flapDest}}" as="c" hint-placeholder-count="12"><span class="ar-flap">{{c.ch}}</span></sc-for>
</span>
<span class="ar-d ar-tnum" aria-hidden="true" style="display: flex; gap: 2px; font-size: 22px; font-weight: 700">
<sc-for list="{{flapAmt}}" as="c" hint-placeholder-count="7"><span class="ar-flap">{{c.ch}}</span></sc-for>
</span>
</span>
</a>

<nav aria-label="Primary" class="{{plateCls}}" style="position: absolute; left: 20px; right: 20px; top: 790px; height: 60px; border-radius: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<a href="Arcology-Vault.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{ink}}" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 20.5h18M5 20.5V10l4-2v12.5M9 20.5V5l6-2v17.5M15 20.5v-9l4 1.5v7.5"></path></svg>
<span style="font-size: 11px; font-weight: 700">City</span>
<span aria-hidden="true" style="position: absolute; bottom: 6px; width: 18px; height: 3px; border-radius: 2px; background: #F2C230"></span>
</a>
<a href="Arcology-Transit.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{muted}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="14" rx="3"></rect><path d="M6 10h12M9 20.5l-1.5 1.5M15 20.5l1.5 1.5"></path><circle cx="9" cy="13.5" r=".9" fill="currentColor"></circle><circle cx="15" cy="13.5" r=".9" fill="currentColor"></circle></svg>
<span style="font-size: 11px; font-weight: 600">Transit</span>
</a>
<a href="Meridian-Activity.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{muted}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
<span style="font-size: 11px; font-weight: 600">Ledger</span>
</a>
<a href="Meridian-Appearance.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{muted}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"></path></svg>
<span style="font-size: 11px; font-weight: 600">Themes</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"night":{"editor":"boolean","default":false,"section":"Scene"},"$preview":{"width":402,"height":874}}'>
/* Arcology isometric city engine — pure functions, no DOM. Shared by every Arcology board.
   Grid coords (gx right-down, gy left-down) project to screen with a 2:1 isometric matrix.
   Tower height is money: each district's tallest tower is proportional to that asset's value. */
const AR = (function () {
  function hx(c) { if (c.indexOf('rgb') === 0) return c.match(/[\d.]+/g).slice(0, 3).map(Number); c = c.replace('#', ''); return [parseInt(c.substr(0, 2), 16), parseInt(c.substr(2, 2), 16), parseInt(c.substr(4, 2), 16)]; }
  function mix(a, b, t) {
    if (a.indexOf('rgba(') === 0 || b.indexOf('rgba(') === 0) {
      const pa = a.match(/[\d.]+/g).map(Number), pb = b.match(/[\d.]+/g).map(Number);
      return 'rgba(' + pa.map((v, i) => (i < 3 ? Math.round(v + (pb[i] - v) * t) : (v + (pb[i] - v) * t).toFixed(3))).join(',') + ')';
    }
    const A = hx(a), B = hx(b);
    return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')';
  }
  const PAL = {
    top: ['#FCFDFD', '#2C364B'], left: ['#E4E8EC', '#1E2639'], right: ['#C8CFD8', '#151B2B'],
    ground: ['#EEF1F3', '#161D2E'], road: ['#DDE2E7', '#0F1522'], plaza: ['#F6F7F8', '#1A2236'],
    plinthTop: ['#E7D5AF', '#5A4A31'], plinthL: ['#D7C095', '#4A3D29'], plinthR: ['#BDA374', '#3B3121'],
    water: ['#C3DCF0', '#0F2A52'], waterHi: ['#E6F1FA', '#2A4C86'],
    tree: ['#E7ECE4', '#283145'], treeDark: ['#CDD5CA', '#1B2232'],
    beam: ['#97A2B0', '#46526E'], pillar: ['#B3BCC7', '#2E3854'], station: ['#FFFFFF', '#2B3550'],
    shadow: ['rgba(30,46,70,0.17)', 'rgba(30,46,70,0)'], light: ['rgba(242,194,48,0)', 'rgba(255,214,102,0.95)']
  };
  /* Dusk: warm low sun on the model. Used as the middle stop when build({ dusk: true }). */
  const DUSK = {
    top: '#FBE4D2', left: '#EAC8B4', right: '#A99CB2', ground: '#EAD4C5', road: '#D9C1B5', plaza: '#F3DFD2',
    plinthTop: '#E5C091', plinthL: '#D0A775', plinthR: '#A9855A', water: '#C8B5D2', waterHi: '#F4DDE2',
    tree: '#E3D3C3', treeDark: '#C3B1A7', beam: '#9B8B9A', pillar: '#B6A3AE', station: '#FFF6EE',
    shadow: 'rgba(84,44,74,0.24)', light: 'rgba(255,196,92,0.8)'
  };
  const ASSET = {
    USD: { name: 'USD', glyph: '$', glass: '#9EB2C8', glow: '#EEF4FF', cap: '#4F5D70', line: '#5E6B7D' },
    USDC: { name: 'USDC', glyph: 'C', glass: '#7FB1F2', glow: '#5CA8FF', cap: '#2F7DF0', line: '#3D8BFF' },
    BTC: { name: 'BTC', glyph: 'B', glass: '#F0B27C', glow: '#FFAB4F', cap: '#E9801F', line: '#F28C28' },
    ETH: { name: 'ETH', glyph: 'E', glass: '#B9A6F2', glow: '#AE90FF', cap: '#7E5DEB', line: '#8C6CF2' }
  };
  /* City plan on a 10x10 grid. Quadrants: USDC back, USD right, BTC left, ETH front. Towers: [x, y, w, d, share-of-tallest]. */
  const PLAN = {
    N: 10,
    roads: [[0, 4.6, 10, 0.8], [4.6, 0, 0.8, 10]],
    plaza: [4.35, 4.35, 1.3, 1.3],
    water: [[0.5, 8.3, 2.4, 1.1]],
    districts: {
      USDC: [[1.0, 1.0, 1.6, 1.6, 1], [3.0, 0.8, 1.0, 1.0, 0.62], [0.9, 3.0, 1.1, 1.0, 0.48], [3.0, 2.8, 1.0, 1.1, 0.36]],
      USD: [[6.2, 1.6, 2.0, 2.0, 1], [8.5, 0.7, 1.0, 1.0, 0.55], [5.9, 0.4, 1.4, 0.8, 0.34], [8.6, 2.7, 0.9, 1.3, 0.46]],
      BTC: [[1.4, 6.0, 1.6, 1.6, 1], [3.3, 5.9, 1.0, 1.0, 0.6], [3.4, 7.5, 1.0, 1.2, 0.42]],
      ETH: [[6.4, 6.4, 1.4, 1.4, 1], [8.2, 6.1, 1.0, 1.0, 0.62]]
    },
    fillers: [[0.3, 0.3, 0.5, 0.5, 6], [2.2, 3.4, 0.5, 0.5, 9], [0.4, 2.0, 0.4, 0.7, 5], [7.6, 0.4, 0.6, 0.6, 7], [5.9, 3.9, 0.5, 0.5, 6],
      [0.4, 5.7, 0.6, 0.5, 6], [3.3, 9.0, 0.7, 0.5, 5], [5.8, 5.8, 0.4, 0.4, 8], [9.0, 4.0, 0.5, 0.4, 5], [8.6, 7.6, 0.6, 0.6, 7]],
    trees: [[5.9, 8.6, 0.24], [6.6, 9.1, 0.28], [7.4, 8.7, 0.22], [8.1, 9.2, 0.26], [8.9, 8.6, 0.23], [7.0, 8.0, 0.2],
      [2.3, 5.5, 0.2], [0.5, 4.2, 0.2], [4.2, 4.2, 0.18], [5.8, 4.2, 0.18], [4.2, 5.8, 0.18], [5.8, 5.8, 0.18],
      [9.3, 5.6, 0.2], [2.6, 0.4, 0.2], [4.1, 2.2, 0.2], [3.0, 9.5, 0.2]],
    track: { z: 16, pts: [[9.72, 0.6], [9.72, 9.72], [0.6, 9.72]], stations: [{ id: 'op', at: [9.72, 5.0], name: 'Operating Plaza' }, { id: 'pf', at: [0.9, 9.72], name: 'Pioneer Fund' }] }
  };
  function proj(o) { return function (gx, gy, z) { return [o.ox + (gx - gy) * o.tw / 2, o.oy + (gx + gy) * o.tw / 4 - (z || 0)]; }; }
  function poly(pts) { return 'M' + pts.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ' Z'; }
  function box(P, x, y, w, d, z0, h) {
    const A = [x, y], B = [x + w, y], C = [x + w, y + d], D = [x, y + d];
    const t = (q, z) => P(q[0], q[1], z);
