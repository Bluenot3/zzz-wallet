<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    const AVAIL = 118400;
    const MAXROT = AVAIL / 250 * 1.5;
    const st = this.state || {};
    const rot = st.rot != null ? st.rot : 150;
    const amount = Math.max(0, Math.min(AVAIL, Math.round(rot / 1.5) * 250));
    if (!this._h) {
      const toRot = (v) => Math.max(0, Math.min(MAXROT, v / 250 * 1.5));
      const angleOf = (e) => {
        const el = this._dial;
        if (!el) return 0;
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
      };
      this._h = {
        dialRef: (el) => { this._dial = el; },
        grab: (e) => {
          this._drag = true;
          this._last = angleOf(e);
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        },
        turn: (e) => {
          if (!this._drag) return;
          const a = angleOf(e);
          let d = a - this._last;
          if (d > 180) d -= 360;
          if (d < -180) d += 360;
          this._last = a;
          const cur = (this.state && this.state.rot != null) ? this.state.rot : 150;
          this.setState({ rot: Math.max(0, Math.min(MAXROT, cur + d)) });
        },
        release: () => { this._drag = false; },
        fromRange: (e) => this.setState({ rot: toRot(Number(e.target.value)) }),
        set5: () => this.setState({ rot: toRot(5000) }),
        set10: () => this.setState({ rot: toRot(10000) }),
        set25: () => this.setState({ rot: toRot(25000) }),
        setMax: () => this.setState({ rot: toRot(AVAIL) })
      };
    }
    const C = 911.06;
    const frac = rot >= 360 && rot % 360 < 0.01 ? 1 : (rot % 360) / 360;
    const money = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const on = (v) => amount === v;
    const pick = (v) => ({ c: on(v) ? 'matte-in' : 'matte', p: on(v), t: on(v) ? '#F1DDA6' : '#D5DBE8' });
    const a = pick(5000), b = pick(10000), c = pick(25000), m = pick(AVAIL);
    return Object.assign({}, this._h, {
      rot: rot.toFixed(2),
      amount: amount,
      amountWhole: '$' + amount.toLocaleString('en-US'),
      share: (amount / AVAIL * 100).toFixed(1) + '%',
      remains: money(AVAIL - amount),
      arcOffset: (C * (1 - frac)).toFixed(2),
      oviPos: (20 + (rot % 360) / 360 * 60).toFixed(1) + '%',
      c5: a.c, p5: a.p, t5: a.t,
      c10: b.c, p10: b.p, t10: b.t,
      c25: c.c, p25: c.p, t25: c.t,
      cMax: m.c, pMax: m.p, tMax: m.t
    });
  }
}
</script>
