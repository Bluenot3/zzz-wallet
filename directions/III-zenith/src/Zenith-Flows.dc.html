<script type="text/x-dc" data-dc-script data-props='{"range":{"editor":"enum","options":["7D","30D","90D"],"default":"30D","section":"Data"},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const range = st.range || this.props.range || '30D';
    const sel = st.sel || 'arsenal';
    const DATA = {
      '7D': { arsenal: 9120, qubit: 3380, yield: 52, pioneer: 0, compute: 2210, counts: { arsenal: 51, qubit: 17, yield: 7, pioneer: 0, compute: 3 } },
      '30D': { arsenal: 38600, qubit: 14250, yield: 225, pioneer: 12500, compute: 9480, counts: { arsenal: 214, qubit: 68, yield: 30, pioneer: 1, compute: 12 } },
      '90D': { arsenal: 112400, qubit: 39900, yield: 640, pioneer: 37500, compute: 27150, counts: { arsenal: 633, qubit: 197, yield: 90, pioneer: 3, compute: 36 } }
    };
    const D = DATA[range];
    const BODIES = [
      { id: 'arsenal', name: 'Arsenal', role: 'Revenue · arsenal.world subscriptions', dir: 'in', x: 74, y: 96, size: 26, lx: 34, ly: 124, last: '4:58 PM', d: 'M74 96C150 64 162 176 201 222' },
      { id: 'qubit', name: 'Qubit agents', role: 'Revenue · qubit.earth business agents', dir: 'in', x: 334, y: 84, size: 20, lx: 262, ly: 108, last: '3:12 PM', d: 'M334 84C300 160 246 120 201 222' },
      { id: 'yield', name: 'Reserve yield', role: 'USDC yield · accrues daily', dir: 'in', x: 58, y: 330, size: 12, lx: 24, ly: 350, last: '12:00 AM', d: 'M58 330C86 250 150 290 201 222' },
      { id: 'pioneer', name: 'Pioneer Fund', role: 'Program grants · AI Pioneer Program', dir: 'out', x: 330, y: 338, size: 26, lx: 280, ly: 362, last: 'Sep 12', d: 'M201 222C262 238 246 336 330 338' },
      { id: 'compute', name: 'Compute & models', role: 'Inference · GPU and model usage', dir: 'out', x: 190, y: 398, size: 18, lx: 58, ly: 400, last: '2:40 PM', d: 'M201 222C150 290 238 330 190 398' }
    ];
    if (!this._h) {
      this._h = {};
      ['7D', '30D', '90D'].forEach((r) => { this._h['r' + r] = () => this.setState({ range: r }); });
      BODIES.forEach((b) => { this._h['b' + b.id] = () => this.setState({ sel: b.id }); });
    }
    const money = (n) => '$' + n.toLocaleString('en-US');
    const kfmt = (n) => n >= 1000 ? '$' + (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'K' : '$' + n;
    const inT = D.arsenal + D.qubit + D.yield, outT = D.pioneer + D.compute, maxT = Math.max(inT, outT);
    const vmax = Math.max(D.arsenal, D.qubit, D.yield, D.pioneer, D.compute);
    const streams = [], particles = [];
    const bodies = BODIES.map((b) => {
      const v = D[b.id], isIn = b.dir === 'in', on = sel === b.id;
      const w = v > 0 ? 1.2 + 6.5 * Math.sqrt(v / vmax) : 0.6;
      streams.push({ d: b.d, w: w.toFixed(2), glowW: (w * 3.2).toFixed(2), grad: isIn ? 'url(#zn-in)' : 'url(#zn-out)', glow: isIn ? 'rgba(127,227,240,.10)' : 'rgba(255,190,138,.10)' });
      const n = v > 0 ? (v / vmax > 0.5 ? 4 : v / vmax > 0.15 ? 3 : 2) : 0;
      const dur = (3.8 - 1.4 * Math.sqrt(v / vmax)).toFixed(2);
      for (let i = 0; i < n; i++) {
        particles.push({ d: b.d, size: (2.4 + 2.2 * Math.sqrt(v / vmax)).toFixed(1), core: isIn ? '#EAFBFF' : '#FFF1E4', glow: isIn ? 'rgba(127,227,240,.85)' : 'rgba(255,190,138,.85)', dur: dur + 's', delay: (-(i * Number(dur)) / n).toFixed(2) + 's' });
      }
      const color = isIn ? (b.id === 'yield' ? '#6FA8FF' : '#7FE3F0') : (b.id === 'compute' ? '#A88BFF' : '#FFBE8A');
      const box = Math.max(44, b.size + 18);
      return Object.assign({}, b, {
        pick: this._h['b' + b.id], on: on, color: color, halo: isIn ? 'rgba(127,227,240,.5)' : 'rgba(255,190,138,.45)',
        ink: isIn ? '#CFF6FB' : '#FFD6B3', short: (isIn ? '+' : '−') + kfmt(v), box: box, bx: b.x - box / 2, by: b.y - box / 2,
        selOpacity: on ? 0.9 : 0, aria: b.name + ', ' + (isIn ? 'inflow ' : 'outflow ') + money(v) + ' over ' + range
      });
    });
    const s = bodies.find((b) => b.id === sel) || bodies[0];
    const total = s.dir === 'in' ? inT : outT;
    const RN = { '7D': '7 DAYS', '30D': '30 DAYS', '90D': '90 DAYS' };
    return {
      ranges: ['7D', '30D', '90D'].map((r) => ({ label: r, on: r === range, pick: this._h['r' + r], bg: r === range ? 'rgba(127,227,240,.18)' : 'transparent', ink: r === range ? '#CFF6FB' : '#9BA2B4' })),
      rangeName: RN[range],
      streams: streams,
      particles: particles,
      bodies: bodies,
      net: (inT - outT >= 0 ? '+' : '−') + money(Math.abs(inT - outT)),
      inTotal: money(inT), outTotal: money(outT),
      inPct: (inT / maxT * 100).toFixed(1) + '%', outPct: (outT / maxT * 100).toFixed(1) + '%',
      sel: {
        name: s.name, role: s.role, color: s.color, halo: s.halo, ink: s.ink,
        amount: (s.dir === 'in' ? '+' : '−') + money(D[s.id]),
        count: String(D.counts[s.id]), share: total ? Math.round(D[s.id] / total * 100) + '% of ' + (s.dir === 'in' ? 'in' : 'out') : '—',
        last: D[s.id] ? s.last : '—'
      }
    };
  }
}
</script>
