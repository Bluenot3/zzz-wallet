<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent} canvas{display:block}</style>
<script src="../assets/zenith-core.js"></script></head><body><canvas id="c"></canvas>
<script>
window.renderPoster = function(w, h, opts, t, params){
  var c = document.getElementById('c'); c.style.width = w + 'px'; c.style.height = h + 'px';
  opts.intro = false; opts.interactive = false;
  var inst = ZenithCore.mount(c, opts);
  return new Promise(function(res){ setTimeout(function(){ inst.renderAt(t, params); res(c.toDataURL('image/png')); }, 250); });
};
</script></body></html>
